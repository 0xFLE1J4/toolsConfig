# ==============================================================================
# OPTIONS GLOBALES
# ==============================================================================
set-option -g default-shell /bin/zsh
set -g mouse on
set -g base-index 1
set -g pane-base-index 1
set -g default-terminal "screen-256color"
set -ga terminal-overrides ",xterm-256color:Tc"
set -g detach-on-destroy off
set -g history-limit 10000
set -g repeat-time 300
# ==============================================================================
# PREFIX KEY
# ==============================================================================
set -g prefix M-a
unbind C-b
bind M-a send-prefix
# ==============================================================================
# COPIE (VI + WAYLAND)
# ==============================================================================
setw -g mode-keys vi
bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi y send-keys -X copy-pipe "wl-copy"
unbind -T copy-mode-vi MouseDragEnd1Pane
bind-key -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe "wl-copy"
# ==============================================================================
# THEME (TOKYO NIGHT)
# ==============================================================================
# Palette : bg #1a1b26 / surface #24283b #292e42 / bordure #414868 / muted #565f89
#           texte #c0caf5 / bleu #7aa2f7 / cyan #7dcfff / mauve #bb9af7
#           vert #9ece6a / jaune #e0af68 / orange #ff9e64 / rouge #f7768e

set -g window-style 'bg=#1a1b26'
set -g window-active-style 'bg=#24283b'
set -g pane-border-style "fg=#414868,bg=#1a1b26"
set -g pane-active-border-style "fg=#7aa2f7,bg=#24283b"
set -g pane-border-status top
set -g pane-border-format "#[fg=#565f89] #{pane_index} #{pane_current_command} "

set -g status-position top
set -g status-interval 5
set -g status-style "bg=#24283b,fg=#c0caf5"

set -g status-left-length 50
set -g status-left "#[fg=#1a1b26,bg=#7aa2f7,bold] ● #S #[fg=#7aa2f7,bg=#24283b]#[default] "

set -g window-status-separator ""
set -g window-status-style "fg=#565f89,bg=#24283b"
set -g window-status-format "#[fg=#c0caf5,bg=#292e42] #I #W #[fg=#292e42,bg=#24283b] "
set -g window-status-current-format "#[fg=#1a1b26,bg=#bb9af7,bold] 󰓩 #I:#W#{?window_zoomed_flag,[+],} #[fg=#bb9af7,bg=#24283b]#[default] "
set -g window-status-activity-style "fg=#f7768e,bg=#24283b,bold"
set -g window-status-bell-style "fg=#1a1b26,bg=#f7768e,bold"

set -g status-right-length 150
set -g status-right "#{?pane_synchronized,#[fg=#1a1b26]#[bg=#f7768e]#[bold] ⇄ SYNC #[fg=#f7768e]#[bg=#24283b]#[default],}\
#[fg=#414868,bg=#24283b]#[bg=#414868,fg=#c0caf5] 󰒋 #(ip addr show tun0 2>/dev/null | grep 'inet ' | awk '{print $2}' | cut -d'/' -f1 || echo 'Offline') \
#[fg=#e0af68,bg=#414868]#[bg=#e0af68,fg=#1a1b26,bold] %H:%M \
#[fg=#ff9e64,bg=#e0af68]#[bg=#ff9e64,fg=#1a1b26,bold] 󰌌 Alt+a #[fg=#ff9e64,bg=#24283b]#[default]"

set -g message-style "fg=#1a1b26,bg=#7aa2f7,bold"
set -g message-command-style "fg=#c0caf5,bg=#414868"
set -g mode-style "fg=#1a1b26,bg=#bb9af7,bold"
set -g clock-mode-colour "#7aa2f7"
set -g clock-mode-style 24

set -g popup-border-style "fg=#7aa2f7"
set -g popup-style "bg=#1a1b26,fg=#c0caf5"
# ==============================================================================
# RACCOURCIS
# ==============================================================================
bind -r f resize-pane -Z
bind x kill-pane
bind v split-window -v -c "#{pane_current_path}"
bind b split-window -h -c "#{pane_current_path}"
bind -r h select-pane -L
bind -r j select-pane -D
bind -r k select-pane -U
bind -r l select-pane -R
bind -n M-Left select-pane -L
bind -n M-Right select-pane -R
bind -n M-Up select-pane -U
bind -n M-Down select-pane -D
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5
bind = setw synchronize-panes \; display-message "Sync : #{?pane_synchronized,ON,OFF}"
bind r source-file ~/.tmux.conf \; display "Config rechargée"
# ==============================================================================
# POPUPS
# ==============================================================================
bind w display-popup -w 80% -h 80% -E "zsh"
bind g display-popup -w 90% -h 90% -E "htop"
bind n display-popup -w 80% -h 80% -E "nvim ~/notes_ctf.md"
# ==============================================================================
# PLUGINS (TPM)
# ==============================================================================
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @plugin 'laktak/extrakto'
set -g @continuum-restore 'on'
run '~/.tmux/plugins/tpm/tpm'
