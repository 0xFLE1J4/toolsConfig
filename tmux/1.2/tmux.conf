# ==============================================================================
# OPTIONS GLOBALES
# ==============================================================================
set-option -g default-shell /bin/zsh
set -g mouse on
set -g base-index 1
set -g pane-base-index 1
set -g default-terminal "screen-256color"
set -ga terminal-overrides ",xterm-256color:Tc"
set -g detach-on-destroy off
set -g history-limit 10000
set -g repeat-time 300

# ==============================================================================
# PREFIX KEY
# ==============================================================================
set -g prefix M-a
unbind C-b
bind M-a send-prefix

# ==============================================================================
# COPIE (VI + WAYLAND)
# ==============================================================================
setw -g mode-keys vi
bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi y send-keys -X copy-pipe "wl-copy"
unbind -T copy-mode-vi MouseDragEnd1Pane
bind-key -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe "wl-copy"

# ==============================================================================
# THEME (CATPPUCCIN MOCHA)
# ==============================================================================
set -g window-style 'bg=#11111b'
set -g window-active-style 'bg=#1e1e2e'
set -g pane-border-style "fg=#313244,bg=#11111b"
set -g pane-active-border-style "fg=#cba6f7,bg=#1e1e2e"

set -g status-position top
set -g status-interval 5
set -g status-bg "#1e1e2e"
set -g window-status-separator " "

set -g status-left "#[fg=#89b4fa,bg=#1e1e2e]#[bg=#89b4fa,fg=#1e1e2e,bold]  #S #[fg=#89b4fa,bg=#1e1e2e] "
set -g status-left-length 40

set -g window-status-format "#[fg=#313244,bg=#1e1e2e]#[fg=#cdd6f4,bg=#313244] #I  #W #[fg=#313244,bg=#1e1e2e]"
set -g window-status-current-format "#[fg=#cba6f7,bg=#1e1e2e]#[fg=#1e1e2e,bg=#cba6f7,bold] 󰓩 #I: #W #[fg=#cba6f7,bg=#1e1e2e]"

set -g status-right "#[fg=#313244,bg=#1e1e2e]#[bg=#313244,fg=#cdd6f4] 󰒋 #(ip addr show tun0 2>/dev/null | grep 'inet ' | awk '{print $2}' | cut -d'/' -f1 || echo 'Offline') #[fg=#fab387,bg=#313244]#[bg=#fab387,fg=#1e1e2e,bold] 󰌌 Alt+a #[fg=#fab387,bg=#1e1e2e]"
set -g status-right-length 100

# ==============================================================================
# RACCOURCIS
# ==============================================================================
bind -r f resize-pane -Z
bind x kill-pane
bind v split-window -v -c "#{pane_current_path}"
bind b split-window -h -c "#{pane_current_path}"

bind -r h select-pane -L
bind -r j select-pane -D
bind -r k select-pane -U
bind -r l select-pane -R

bind -n M-Left select-pane -L
bind -n M-Right select-pane -R
bind -n M-Up select-pane -U
bind -n M-Down select-pane -D

bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

bind = setw synchronize-panes \; display-message "Sync : #{?pane_synchronized,ON,OFF}"
bind r source-file ~/.tmux.conf \; display "Config rechargée"

# ==============================================================================
# POPUPS
# ==============================================================================
bind w display-popup -w 80% -h 80% -E "zsh"
bind g display-popup -w 90% -h 90% -E "htop"
bind n display-popup -w 80% -h 80% -E "nvim ~/notes_ctf.md"

# ==============================================================================
# PLUGINS (TPM)
# ==============================================================================
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @plugin 'laktak/extrakto'

set -g @continuum-restore 'on'

run '~/.tmux/plugins/tpm/tpm'
